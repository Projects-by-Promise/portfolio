<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Promise Igbo</title>
  <meta name="robots" content="noindex">
  <!-- Styles are inline on purpose: GitHub Pages can serve this page from any URL depth,
       so relative stylesheet paths would not always resolve. -->
  <style>
    :root { color-scheme: dark light; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      background: #0a1220; color: #dfe7f2; text-align: center; }
    @media (prefers-color-scheme: light) { body { background: #f6f8fc; color: #22324a; } }
    code { font-family: Consolas, Menlo, monospace; color: #3b9dff; font-size: 4rem; font-weight: 700; display: block; }
    h1 { margin: .5rem 0; font-size: 1.6rem; }
    p { opacity: .8; }
    a { display: inline-block; margin-top: 1.25rem; padding: .8rem 1.3rem; border-radius: 999px;
      background: #3b9dff; color: #04101f; font-weight: 600; text-decoration: none; }
    a:focus-visible { outline: 3px solid #50e6ff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <code>404</code>
    <h1>This page could not be found</h1>
    <p>The link may be broken or the page may have moved.</p>
    <a href="./" id="home-link">Back to the portfolio</a>
  </main>
  <script>
    // For project sites (username.github.io/repo/...) send visitors to the repo root.
    (function () {
      var parts = location.pathname.split("/").filter(Boolean);
      if (/\.github\.io$/i.test(location.hostname) && parts.length > 1) {
        document.getElementById("home-link").setAttribute("href", "/" + parts[0] + "/");
      }
    })();
  </script>
</body>
</html>
