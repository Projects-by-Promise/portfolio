<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Architecture: GitHub Actions builds the image once and pushes it to the dev registry; staging and prod import the same digest into their own registries; Helm deploys atomically to Azure Kubernetes Service where ingress routes to a service and autoscaled pods with probes, using workload identity to read Key Vault secrets, with monitoring and automatic rollback.">
