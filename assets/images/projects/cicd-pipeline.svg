<text x="532.0" y="211.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="400" fill="#93a4c3">slot · swap · lock image</text>
<text x="532.0" y="224.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="400" fill="#93a4c3">GitHub Release</text>
