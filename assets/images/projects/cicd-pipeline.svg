<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Architecture: a pull request runs CI and security scans with no Azure access; on merge the image is built once, scanned with Trivy, given an SBOM and pushed to Azure Container Registry via OIDC, then deployed to dev, staging and an approved production using slot swap with automatic rollback.">
