<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f0b429"/></marker>
</defs>
<rect width="640" height="360" fill="url(#bg)"/>
