<text x="24" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#e6edf7">Automated CI/CD Pipeline</text>
<text x="24" y="54" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#93a4c3">GitHub Actions · Docker · Terraform → Azure App Service from Azure Container Registry</text>
